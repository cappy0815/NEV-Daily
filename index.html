<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0d0d">
  <meta name="description" content="NEV Daily – wer ist gerade auf dem Eis? Tagesplan und Wochenplan pro Mannschaft des Neusser EV.">
  <title>NEV Daily</title>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NEV Daily">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <img class="logo" src="assets/nev-logo.png" alt="Neusser EV">
    <div class="brand">
      <div class="title">NEV <span>Daily</span></div>
      <div class="clock" id="clock">–</div>
    </div>
    <button class="icon-btn" id="refreshBtn" aria-label="Aktualisieren" title="Aktualisieren">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
    </button>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab active" data-view="today" role="tab">Heute</button>
    <button class="tab" data-view="team" role="tab">Mannschaft</button>
  </nav>

  <main>
    <!-- ======== HEUTE ======== -->
    <section id="view-today" class="view active">
      <div class="now-card" id="nowCard">
        <div class="now-label"><span class="live-dot"></span>Jetzt auf dem Eis</div>
        <div id="nowBody" class="now-body"><div class="muted">Lade Plan …</div></div>
      </div>

      <div class="daybar">
        <button class="nav-btn" id="dayPrev" aria-label="Vortag">‹</button>
        <button class="day-title" id="dayTitle">Heute</button>
        <button class="nav-btn" id="dayNext" aria-label="Folgetag">›</button>
      </div>

      <div class="filter">
        <label class="chk"><input type="checkbox" id="onlyHall" checked> nur Halle Neuss (Eis + Off-Ice)</label>
      </div>

      <ol class="timeline" id="dayList"></ol>
    </section>

    <!-- ======== MANNSCHAFT ======== -->
    <section id="view-team" class="view">
      <label class="select-wrap">
        <span class="sr">Mannschaft</span>
        <select id="teamSelect"><option value="">Mannschaft wählen …</option></select>
      </label>

      <div class="daybar">
        <button class="nav-btn" id="weekPrev" aria-label="Vorige Woche">‹</button>
        <button class="day-title" id="weekTitle">Diese Woche</button>
        <button class="nav-btn" id="weekNext" aria-label="Nächste Woche">›</button>
      </div>

      <div id="weekList" class="week"></div>
    </section>
  </main>

  <footer class="foot">
    <div id="status">–</div>
    <div class="legend">K = Kabine · Off-Ice A = Raum 1 · Off-Ice B = Raum 2 (Spiegel)</div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
